<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Minesweeper</title>
    <link rel="icon" type="image/svg+xml" href="./src/img/mine.svg">
    <link rel="stylesheet" href="./src/style.css">
    <script type="module" src="./src/main.ts"></script>
    <script src='https://storage.ko-fi.com/cdn/scripts/overlay-widget.js'></script>
</head>
<body>
<div class="status-wrapper">
    <div class="status">
        <div style="display: flex;">
            <div style="flex: 1; text-align: left">Mines</div>
            <div style="flex: 1; text-align: right" id="mines"></div>
        </div>
        <div style="display: flex;">
            <div style="flex: 1; text-align: left">Marker:</div>
            <div style="flex: 1; text-align: right" id="markers"></div>
        </div>
        <div style="display: flex;">
            <div style="flex: 1; text-align: left">Fields:</div>
            <div style="flex: 1; text-align: right" id="fields"></div>
        </div>
        <div style="display: flex;">
            <div style="flex: 1; text-align: left">Lives:</div>
            <div style="flex: 1;" id="lives" role="img"></div>
        </div>
        <div style="display: flex;">
            <div style="flex: 1; text-align: left">Sound:</div>
            <div style="flex: 1; text-align: right"><button type="button" id="sound" aria-label="Sound">ON</button></div>
        </div>
        <div style="display: flex; font-size: 40px;flex-direction: row;">
                <div id="minutes10" style="width: 44px">0</div>
                <div id="minutes1" style="width: 44px">0</div>
                <div style="padding-left: 4px;padding-right: 4px">:</div>
                <div id="seconds10" style="width: 44px">0</div>
                <div id="seconds1" style="width: 44px">0</div>
        </div>
        <div class="actions">
            <button type="button" id="restart">Restart</button>
            <button type="button" id="new-game">New game</button>
        </div>
    </div>
</div>

<div id="root-frame">
    <div id="root"></div>
</div>

<dialog id="start" aria-labelledby="start-title">
    <h1 id="start-title">Minesweeper</h1>
    <p>Choose a level</p>
    <div class="choices" id="levels"></div>
    <p class="hint">Left click reveals, right click flags.<br>Click a number to open its neighbours.<br>Each mine costs half a heart.<br>Harder levels give more hearts.</p>
</dialog>

<dialog id="end" aria-labelledby="end-title">
    <h1 id="end-title"></h1>
    <p id="end-detail"></p>
    <div class="choices">
        <button type="button" id="again">Play again</button>
        <button type="button" id="menu">Change level</button>
    </div>
</dialog>
<script>
    kofiWidgetOverlay.draw('mansi1', {
        'type': 'floating-chat',
        'floating-chat.donateButton.text': 'Support me',
        'floating-chat.donateButton.background-color': '#a3a3a3',
        'floating-chat.donateButton.text-color': '#fff'
    });
</script>
</body>
</html>
